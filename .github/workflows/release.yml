name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin versions
        run: |
          tag="${GITHUB_REF_NAME}"
          codex_version=$(jq -r '.version' .codex-plugin/plugin.json)
          claude_version=$(jq -r '.version' .claude-plugin/plugin.json)
          npm_version=$(jq -r '.version' package.json)

          test "$codex_version" = "$claude_version" || {
            echo "Version mismatch: codex=$codex_version claude=$claude_version"
            exit 1
          }

          test "$codex_version" = "$npm_version" || {
            echo "Version mismatch: codex=$codex_version npm=$npm_version"
            exit 1
          }

          test "$tag" = "v$codex_version" || {
            echo "Tag $tag does not match manifest version v$codex_version"
            exit 1
          }
      - name: Package skills
        run: zip -r skill.zip skills
      - name: Upload skills release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" skill.zip --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
